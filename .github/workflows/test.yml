name: test
on:
  push:
    branches:
      - '**'
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test auto-merge policy
        run: node --test tests/*.test.cjs
        env:
          MERGE_SETTINGS_TOKEN: ${{ github.token }}
